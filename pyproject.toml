[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-crash-recovery-bench"
version = "0.1.0"
description = "Deterministic crash-recovery semantics benchmark for guarded agent tool loops"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain-core==1.5.3",
  "langchain-openai==1.4.1",
  "langchain-protocol==0.0.18",
  "langgraph==1.2.10",
  "langgraph-checkpoint==4.1.1",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.2",
  "openai==2.53.0",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.14,<1",
]

[project.scripts]
guarded-crash-bench = "guarded_loop.crash_bench:main"
guarded-eval-trace = "guarded_loop.eval_trace:main"
guarded-llm-run = "guarded_loop.llm_run:main"

[tool.setuptools.packages.find]
include = ["guarded_loop*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
timeout = 120
markers = [
  "integration: subprocess or local HTTP integration coverage",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
