app:
  description: Dify crash/retry bench - 人工审批恢复后才执行副作用
  icon: "🛂"
  icon_background: '#D8EDFF'
  icon_type: emoji
  mode: workflow
  name: Dify Bench - HITL before effect
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {enabled: false}
    opening_statement: ''
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: human-input}
        id: start-approval
        source: start
        sourceHandle: source
        target: approval
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: human-input, targetType: http-request}
        id: approval-http
        source: approval
        sourceHandle: approve
        target: effect
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: end}
        id: http-end
        source: effect
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          selected: false
          title: Input
          type: start
          variables:
            - {label: key (A-Za-z0-9_.-), required: true, type: text-input, variable: key}
        height: 90
        id: start
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          delivery_methods:
            - {enabled: true, id: 11111111-1111-4111-8111-111111111111, type: webapp}
          form_content: '批准后才执行副作用：`{{#start.key#}}`'
          inputs: []
          selected: false
          timeout: 3
          timeout_unit: day
          title: Approval
          type: human-input
          user_actions:
            - {button_style: primary, id: approve, title: Approve}
        height: 164
        id: approval
        position: {x: 350, y: 240}
        positionAbsolute: {x: 350, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {type: no-auth}
          body:
            type: json
            data:
              - key: ''
                type: text
                value: '{"key":"{{#start.key#}}","token":"{{#start.key#}}","status":200,"block":false}'
          desc: 审批完成后执行一次。
          headers: 'Content-Type:application/json'
          method: POST
          params: ''
          retry_config: {max_retries: 0, retry_enabled: false, retry_interval: 0}
          selected: false
          timeout: {connect: 10, read: 30, write: 30}
          title: Apply effect
          type: http-request
          url: http://dify-bench-sink:8099/effect
        height: 110
        id: effect
        position: {x: 660, y: 240}
        positionAbsolute: {x: 660, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          outputs:
            - {value_selector: [effect, status_code], value_type: number, variable: status_code}
            - {value_selector: [approval, __action_id], value_type: string, variable: action_id}
          selected: false
          title: Output
          type: end
        height: 90
        id: end
        position: {x: 970, y: 240}
        positionAbsolute: {x: 970, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.7}
  rag_pipeline_variables: []
