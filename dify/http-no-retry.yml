app:
  description: Dify crash/retry bench - HTTP 失败不重试
  icon: "🔬"
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: workflow
  name: Dify Bench - HTTP no retry
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data: {isInIteration: false, isInLoop: false, sourceType: start, targetType: http-request}
        id: start-http
        source: start
        sourceHandle: source
        target: effect
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, isInLoop: false, sourceType: http-request, targetType: end}
        id: http-end
        source: effect
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          selected: false
          title: Input
          type: start
          variables:
            - {label: key (A-Za-z0-9_.-), required: true, type: text-input, variable: key}
            - {default: 200, label: status, required: true, type: number, variable: status}
            - {default: 'false', label: block, options: ['false', 'true'], required: true, type: select, variable: block}
        height: 140
        id: start
        position: {x: 40, y: 240}
        positionAbsolute: {x: 40, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {type: no-auth}
          body:
            type: json
            data:
              - key: ''
                type: text
                value: '{"key":"{{#start.key#}}","token":"{{#start.key#}}","status":{{#start.status#}},"block":{{#start.block#}}}'
          desc: 副作用先落盘，再按输入返回状态码；禁用重试和错误处理。
          headers: 'Content-Type:application/json'
          method: POST
          params: ''
          retry_config: {max_retries: 0, retry_enabled: false, retry_interval: 0}
          selected: false
          timeout: {connect: 10, read: 300, write: 30}
          title: Apply effect
          type: http-request
          url: http://dify-bench-sink:8099/effect
        height: 110
        id: effect
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          outputs:
            - {value_selector: [effect, status_code], value_type: number, variable: status_code}
            - {value_selector: [effect, body], value_type: string, variable: body}
          selected: false
          title: Output
          type: end
        height: 90
        id: end
        position: {x: 680, y: 240}
        positionAbsolute: {x: 680, y: 240}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
  rag_pipeline_variables: []
